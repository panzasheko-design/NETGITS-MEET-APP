<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetGits Meet Ultimate</title>
    <!-- PeerJS CDN -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --sidebar-bg: #0b0f19;
            --accent: #2563eb;
            --danger: #ef4444;
            --success: #10b981;
            --text: #f8fafc;
            --subtext: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: var(--card-bg);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            height: 60px;
        }

        .brand { font-size: 1.2rem; font-weight: bold; color: var(--accent); display: flex; align-items: center; gap: 8px; }
        .room-badge { background: #334155; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; color: #e2e8f0; }

        .app-body {
            display: flex;
            flex: 1;
            height: calc(100vh - 130px);
            position: relative;
        }

        .stage {
            flex: 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            width: 100%;
            height: 100%;
            max-width: 1400px;
        }

        .video-box {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            border: 2px solid #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 200px;
        }

        video { width: 100%; height: 100%; object-fit: cover; }
        .mirror { transform: scaleX(-1); }

        .video-overlay {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(15, 23, 42, 0.75);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
        }

        .sidebar {
            width: 320px;
            background: var(--sidebar-bg);
            border-right: 1px solid #334155;
            display: none;
            flex-direction: column;
        }
        .sidebar.active { display: flex; }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid #334155;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: #1e293b; padding: 8px 12px; border-radius: 8px; font-size: 0.88rem; max-width: 85%; }
        .msg.me { background: var(--accent); align-self: flex-end; }

        .chat-input-box { padding: 12px; border-top: 1px solid #334155; display: flex; gap: 8px; }
        .chat-input-box input { flex: 1; background: #1e293b; border: 1px solid #334155; color: #fff; padding: 8px; border-radius: 6px; }

        footer {
            background: var(--card-bg);
            height: 70px;
            border-top: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 0 15px;
        }

        .btn-ctrl {
            background: #334155;
            color: #fff;
            border: none;
            min-width: 45px;
            height: 45px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .btn-ctrl.off { background: var(--danger); }
        .btn-end { background: var(--danger); font-weight: bold; padding: 0 15px; }

        .setup-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex; align-items: center; justify-content: center;
            z-index: 999;
        }

        .setup-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            width: 100%; max-width: 450px;
            border: 1px solid #334155;
            text-align: center;
        }

        input[type="text"] {
            width: 100%; padding: 12px;
            background: #0b0f19;
            border: 1px solid #334155;
            border-radius: 8px; color: #fff;
            margin: 10px 0 15px 0;
            direction: ltr;
        }

        .btn-action {
            width: 100%; padding: 12px;
            background: var(--accent);
            color: #fff; border: none;
            border-radius: 8px; font-weight: bold;
            cursor: pointer; margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand"><span>🚀</span> NetGits Meet Ultimate</div>
        <div class="room-badge" id="roomStatus">خارج الغرفة</div>
    </header>

    <div class="app-body">
        <div class="stage">
            <div class="video-grid" id="videoGrid">
                <div class="video-box" id="box-local">
                    <video id="localVideo" class="mirror" autoplay playsinline muted></video>
                    <div class="video-overlay" id="localTag">أنت</div>
                </div>
            </div>
        </div>

        <div class="sidebar" id="sidebarPanel">
            <div class="sidebar-header">
                <span>المحادثة النصية</span>
                <button style="background:none; border:none; color:#fff; cursor:pointer;" onclick="toggleSidebar()">✕</button>
            </div>
            <div class="chat-messages" id="chatBox"></div>
            <div class="chat-input-box">
                <input type="text" id="chatInput" placeholder="اكتب رسالة..." onkeypress="handleChatKey(event)">
                <button class="btn-ctrl" onclick="sendChatMessage()">إرسال</button>
            </div>
        </div>
    </div>

    <footer id="footerControls" style="display:none;">
        <button class="btn-ctrl" id="micBtn" onclick="toggleMic()">🎙️</button>
        <button class="btn-ctrl" id="camBtn" onclick="toggleCam()">📹</button>
        <button class="btn-ctrl" id="screenBtn" onclick="toggleScreenShare()">💻</button>
        <button class="btn-ctrl" onclick="toggleSidebar()">💬</button>
        <button class="btn-ctrl btn-end" onclick="logout()">مغادرة 🚪</button>
    </footer>

    <div class="setup-overlay" id="setupOverlay">
        <div class="setup-card">
            <h2>انضمام لغرفة GitHub Pages</h2>
            <input type="text" id="userNameInput" placeholder="اسمك (مثال: أحمد)">
            <input type="text" id="roomNameInput" placeholder="اسم الغرفة (مثال: my-room)">
            
            <button class="btn-action" onclick="initRoom(true)">إنشاء كـ (Host)</button>
            <button class="btn-action" style="background:#10b981;" onclick="initRoom(false)">انضمام كـ (Guest)</button>
        </div>
    </div>

    <script>
        let peer = null;
        let localStream = null;
        let dataConn = null;
        let isMicOn = true, isCamOn = true;
        let userName = "";

        async function initRoom(isHost) {
            const roomName = document.getElementById('roomNameInput').value.trim().toLowerCase();
            userName = document.getElementById('userNameInput').value.trim() || "مشارك";

            if (!roomName) return alert("ادخل اسم الغرفة أولاً!");

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
            } catch (e) {
                return alert("يرجى إعطاء صلاحية الكاميرا والمايكروفون!");
            }

            document.getElementById('setupOverlay').style.display = 'none';
            document.getElementById('footerControls').style.display = 'flex';
            document.getElementById('localTag').innerText = `${userName} (أنت)`;
            document.getElementById('roomStatus').innerText = `الغرفة: ${roomName}`;

            // Host gets exact roomName as ID, Guest gets random ID
            const peerId = isHost ? `netgits-${roomName}` : `netgits-${roomName}-user-${Math.floor(Math.random()*1000)}`;
            
            peer = new Peer(peerId, {
                config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
            });

            peer.on('open', (id) => {
                console.log("My Peer ID:", id);
                if (!isHost) {
                    // Connect to Host Video + Chat
                    const hostId = `netgits-${roomName}`;
                    const call = peer.call(hostId, localStream);
                    call.on('stream', remoteStream => addRemoteVideo(hostId, remoteStream));
                    
                    dataConn = peer.connect(hostId);
                    setupDataConnection(dataConn);
                }
            });

            // Host Listeners for Incoming Calls and Chat
            peer.on('call', call => {
                call.answer(localStream);
                call.on('stream', remoteStream => addRemoteVideo(call.peer, remoteStream));
            });

            peer.on('connection', conn => {
                dataConn = conn;
                setupDataConnection(conn);
            });
        }

        function addRemoteVideo(peerId, stream) {
            if (document.getElementById(`box-${peerId}`)) return;

            const grid = document.getElementById('videoGrid');
            const box = document.createElement('div');
            box.className = 'video-box';
            box.id = `box-${peerId}`;

            const video = document.createElement('video');
            video.srcObject = stream;
            video.autoplay = true;
            video.playsinline = true;

            const overlay = document.createElement('div');
            overlay.className = 'video-overlay';
            overlay.innerText = "طرف آخر";

            box.appendChild(video);
            box.appendChild(overlay);
            grid.appendChild(box);
        }

        function setupDataConnection(conn) {
            conn.on('open', () => console.log("Chat Connected!"));
            conn.on('data', data => {
                if (data.type === 'chat') {
                    renderMessage(data.user, data.text, 'them');
                }
            });
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text || !dataConn) return;

            dataConn.send({ type: 'chat', user: userName, text: text });
            renderMessage(userName, text, 'me');
            input.value = '';
        }

        function renderMessage(user, text, sender) {
            const msg = document.createElement('div');
            msg.className = `msg ${sender}`;
            msg.innerText = `${user}: ${text}`;
            document.getElementById('chatBox').appendChild(msg);
        }

        function handleChatKey(e) { if (e.key === 'Enter') sendChatMessage(); }
        function toggleSidebar() { document.getElementById('sidebarPanel').classList.toggle('active'); }

        function toggleMic() {
            isMicOn = !isMicOn;
            localStream.getAudioTracks()[0].enabled = isMicOn;
            document.getElementById('micBtn').classList.toggle('off', !isMicOn);
        }

        function toggleCam() {
            isCamOn = !isCamOn;
            localStream.getVideoTracks()[0].enabled = isCamOn;
            document.getElementById('camBtn').classList.toggle('off', !isCamOn);
        }

        async function toggleScreenShare() {
            try {
                const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                const videoTrack = screenStream.getVideoTracks()[0];

                document.getElementById('localVideo').srcObject = screenStream;

                videoTrack.onended = () => {
                    document.getElementById('localVideo').srcObject = localStream;
                };
            } catch (e) {
                console.error("Screen Share Failed:", e);
            }
        }

        function logout() { location.reload(); }
    </script>
</body>
</html>
