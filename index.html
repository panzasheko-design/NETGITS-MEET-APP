<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetGits Meet Ultimate - Serverless</title>
    <!-- PeerJS Library for Serverless WebRTC Multi-Peer Connections -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --sidebar-bg: #0b0f19;
            --accent: #2563eb;
            --danger: #ef4444;
            --success: #10b981;
            --text: #f8fafc;
            --subtext: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: var(--card-bg);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            height: 60px;
        }

        .brand { font-size: 1.2rem; font-weight: bold; color: var(--accent); display: flex; align-items: center; gap: 8px; }
        .room-badge { background: #334155; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; color: #e2e8f0; }

        .app-body {
            display: flex;
            flex: 1;
            height: calc(100vh - 130px);
            position: relative;
        }

        .stage {
            flex: 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Dynamic Grid Layout */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            width: 100%;
            height: 100%;
            max-width: 1400px;
        }

        /* Spotlight / Speaker Layout */
        .video-grid.spotlight {
            display: flex;
            flex-direction: column;
        }

        .video-grid.spotlight .video-box.focused {
            flex: 1;
            width: 100%;
            max-height: 75vh;
        }

        .video-grid.spotlight .strip {
            display: flex;
            gap: 10px;
            height: 120px;
            overflow-x: auto;
            width: 100%;
            margin-top: 10px;
        }

        .video-box {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            border: 2px solid #334155;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video { width: 100%; height: 100%; object-fit: cover; }
        .mirror { transform: scaleX(-1); }

        .video-overlay {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(15, 23, 42, 0.75);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
        }

        .reaction-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 2rem;
            animation: pop 0.3s ease-out;
        }

        /* Interactive Whiteboard overlay */
        #whiteboardContainer {
            display: none;
            width: 100%;
            height: 100%;
            background: #fff;
            border-radius: 12px;
            position: relative;
        }
        canvas { width: 100%; height: 100%; cursor: crosshair; }
        .wb-tools {
            position: absolute;
            top: 10px; right: 10px;
            background: #1e293b;
            padding: 8px;
            border-radius: 8px;
            display: flex; gap: 8px;
        }

        /* Sidebar for Chat */
        .sidebar {
            width: 320px;
            background: var(--sidebar-bg);
            border-right: 1px solid #334155;
            display: none;
            flex-direction: column;
        }
        .sidebar.active { display: flex; }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid #334155;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: #1e293b; padding: 8px 12px; border-radius: 8px; font-size: 0.88rem; max-width: 85%; }
        .msg.me { background: var(--accent); align-self: flex-end; }

        .chat-input-box { padding: 12px; border-top: 1px solid #334155; display: flex; gap: 8px; }
        .chat-input-box input { flex: 1; background: #1e293b; border: 1px solid #334155; color: #fff; padding: 8px; border-radius: 6px; }

        /* Footer Controls */
        footer {
            background: var(--card-bg);
            height: 70px;
            border-top: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0 15px;
        }

        .btn-ctrl {
            background: #334155;
            color: #fff;
            border: none;
            min-width: 42px;
            height: 42px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: 0.2s;
        }

        .btn-ctrl:hover { background: #475569; }
        .btn-ctrl.off { background: var(--danger); }
        .btn-ctrl.active-mode { background: var(--accent); }
        .btn-end { background: var(--danger); font-weight: bold; padding: 0 15px; }

        /* Setup Overlay */
        .setup-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex; align-items: center; justify-content: center;
            z-index: 999;
        }

        .setup-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            width: 100%; max-width: 450px;
            border: 1px solid #334155;
        }

        input[type="text"] {
            width: 100%; padding: 12px;
            background: #0b0f19;
            border: 1px solid #334155;
            border-radius: 8px; color: #fff;
            margin: 10px 0 15px 0;
            direction: ltr;
        }

        .btn-action {
            width: 100%; padding: 12px;
            background: var(--accent);
            color: #fff; border: none;
            border-radius: 8px; font-weight: bold;
            cursor: pointer; margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand"><span>🚀</span> NetGits Meet Ultimate</div>
        <div class="room-badge" id="roomStatus">خارج الغرفة</div>
    </header>

    <div class="app-body">
        <div class="stage">
            <div class="video-grid" id="videoGrid">
                <div class="video-box" id="box-local">
                    <video id="localVideo" class="mirror" autoplay playsinline muted></video>
                    <div class="video-overlay">أنت</div>
                    <div class="reaction-badge" id="react-local"></div>
                </div>
            </div>

            <!-- Interactive Whiteboard -->
            <div id="whiteboardContainer">
                <div class="wb-tools">
                    <input type="color" id="wbColor" value="#000000">
                    <button class="btn-ctrl" onclick="clearBoard()">🗑️</button>
                    <button class="btn-ctrl" onclick="toggleWhiteboard()">❌</button>
                </div>
                <canvas id="wbCanvas"></canvas>
            </div>
        </div>

        <!-- Chat Sidebar -->
        <div class="sidebar" id="sidebarPanel">
            <div class="sidebar-header">
                <span>المحادثة المباشرة</span>
                <button style="background:none; border:none; color:#fff; cursor:pointer;" onclick="toggleSidebar()">✕</button>
            </div>
            <div class="chat-messages" id="chatBox"></div>
            <div class="chat-input-box">
                <input type="text" id="chatInput" placeholder="اكتب رسالة..." onkeypress="handleChatKey(event)">
                <button class="btn-ctrl" onclick="sendChatMessage()">إرسال</button>
            </div>
        </div>
    </div>

    <!-- Controls -->
    <footer id="footerControls" style="display:none;">
        <button class="btn-ctrl" id="micBtn" onclick="toggleMic()" title="المايك">🎙️</button>
        <button class="btn-ctrl" id="camBtn" onclick="toggleCam()" title="الكاميرا">📹</button>
        <button class="btn-ctrl" id="screenBtn" onclick="toggleScreenShare()" title="مشاركة الشاشة">💻</button>
        <button class="btn-ctrl" onclick="toggleWhiteboard()" title="السبورة">🎨</button>
        <button class="btn-ctrl" onclick="sendReaction('✋')" title="رفع اليد">✋</button>
        <button class="btn-ctrl" onclick="sendReaction('❤️')" title="تفاعل">❤️</button>
        <button class="btn-ctrl" id="recBtn" onclick="toggleRecording()" title="تسجيل">🔴</button>
        <button class="btn-ctrl" onclick="toggleSidebar()" title="الشات">💬</button>
        <button class="btn-ctrl btn-end" onclick="logout()" title="إنهاء">مغادرة 🚪</button>
    </footer>

    <!-- Setup Modal -->
    <div class="setup-overlay" id="setupOverlay">
        <div class="setup-card">
            <h2>الانضمام للغرفة</h2>
            <p style="color:var(--subtext); font-size:0.85rem; margin-top:5px;">ادخل اسم الغرفة للاتصال المباشر عبر GitHub Pages</p>
            <input type="text" id="roomNameInput" placeholder="اسم الغرفة (مثال: dev-room)">
            <input type="text" id="userNameInput" placeholder="اسمك (مثال: أحمد)">
            <button class="btn-action" onclick="joinRoom()">دخول الاجتماع</button>
        </div>
    </div>

    <script>
        let peer = null;
        let localStream = null;
        let peers = {};
        let dataConns = [];
        let currentRoom = "";
        let userName = "";
        let isMicOn = true, isCamOn = true, isRecording = false;
        let mediaRecorder, recordedChunks = [];

        // Canvas Setup
        const canvas = document.getElementById('wbCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('room')) {
                document.getElementById('roomNameInput').value = urlParams.get('room');
            }
        };

        async function joinRoom() {
            currentRoom = document.getElementById('roomNameInput').value.trim();
            userName = document.getElementById('userNameInput').value.trim() || "مشارك";

            if (!currentRoom) return alert("يرجى إدخال اسم الغرفة!");

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
            } catch (e) {
                alert("يرجى إعطاء صلاحيات الكاميرا والمايكروفون!");
                return;
            }

            document.getElementById('setupOverlay').style.display = 'none';
            document.getElementById('footerControls').style.display = 'flex';
            document.getElementById('roomStatus').innerText = `الغرفة: ${currentRoom}`;

            // Initialize PeerJS for Serverless signaling over GitHub Pages
            const peerId = `${currentRoom}-${Math.random().toString(36).substring(2, 7)}`;
            peer = new Peer(peerId, {
                config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
            });

            peer.on('open', () => {
                // Discover existing peers using a simple mesh signaling convention
                broadcastPresence(peerId);
            });

            // Handle incoming media calls
            peer.on('call', call => {
                call.answer(localStream);
                call.on('stream', remoteStream => {
                    addRemoteVideo(call.peer, remoteStream);
                });
            });

            // Handle incoming data connections (Chat & Sync)
            peer.on('connection', conn => {
                setupDataConnection(conn);
            });
        }

        function broadcastPresence(myPeerId) {
            // Signal connection attempt to room mesh
            const conn = peer.connect(`${currentRoom}-host`);
            if (conn) setupDataConnection(conn);
        }

        function setupDataConnection(conn) {
            dataConns.push(conn);
            conn.on('data', data => {
                if (data.type === 'chat') renderMessage(data.user, data.text, 'them');
                if (data.type === 'reaction') showReaction(data.peerId, data.symbol);
                if (data.type === 'draw') drawOnCanvas(data.x, data.y, data.color, false);
                if (data.type === 'clear_board') ctx.clearRect(0, 0, canvas.width, canvas.height);
            });
        }

        function addRemoteVideo(peerId, stream) {
            if (document.getElementById(`box-${peerId}`)) return;

            const grid = document.getElementById('videoGrid');
            const box = document.createElement('div');
            box.className = 'video-box';
            box.id = `box-${peerId}`;

            const video = document.createElement('video');
            video.srcObject = stream;
            video.autoplay = true;
            video.playsinline = true;

            const overlay = document.createElement('div');
            overlay.className = 'video-overlay';
            overlay.innerText = 'مشارك';

            const react = document.createElement('div');
            react.className = 'reaction-badge';
            react.id = `react-${peerId}`;

            box.appendChild(video);
            box.appendChild(overlay);
            box.appendChild(react);
            grid.appendChild(box);
        }

        // Chat System
        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            renderMessage(userName, text, 'me');
            dataConns.forEach(conn => conn.send({ type: 'chat', user: userName, text }));
            input.value = '';
        }

        function renderMessage(user, text, sender) {
            const msg = document.createElement('div');
            msg.className = `msg ${sender}`;
            msg.innerText = `${user}: ${text}`;
            document.getElementById('chatBox').appendChild(msg);
        }

        function handleChatKey(e) { if (e.key === 'Enter') sendChatMessage(); }
        function toggleSidebar() { document.getElementById('sidebarPanel').classList.toggle('active'); }

        // Controls Logic
        function toggleMic() {
            isMicOn = !isMicOn;
            localStream.getAudioTracks()[0].enabled = isMicOn;
            document.getElementById('micBtn').classList.toggle('off', !isMicOn);
        }

        function toggleCam() {
            isCamOn = !isCamOn;
            localStream.getVideoTracks()[0].enabled = isCamOn;
            document.getElementById('camBtn').classList.toggle('off', !isCamOn);
        }

        async function toggleScreenShare() {
            try {
                const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                const videoTrack = screenStream.getVideoTracks()[0];

                for (let p in peers) {
                    const sender = peers[p].peerConnection.getSenders().find(s => s.track.kind === 'video');
                    if (sender) sender.replaceTrack(videoTrack);
                }

                document.getElementById('localVideo').srcObject = screenStream;

                videoTrack.onended = () => {
                    const camTrack = localStream.getVideoTracks()[0];
                    for (let p in peers) {
                        const sender = peers[p].peerConnection.getSenders().find(s => s.track.kind === 'video');
                        if (sender) sender.replaceTrack(camTrack);
                    }
                    document.getElementById('localVideo').srcObject = localStream;
                };
            } catch (e) { console.error(e); }
        }

        // Whiteboard Functions
        function toggleWhiteboard() {
            const wb = document.getElementById('whiteboardContainer');
            const isVis = wb.style.display === 'block';
            wb.style.display = isVis ? 'none' : 'block';
            document.getElementById('videoGrid').style.display = isVis ? 'grid' : 'none';
            if (!isVis) { canvas.width = wb.clientWidth; canvas.height = wb.clientHeight; }
        }

        canvas.addEventListener('mousedown', () => isDrawing = true);
        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mousemove', e => {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const color = document.getElementById('wbColor').value;
            drawOnCanvas(x, y, color, true);
        });

        function drawOnCanvas(x, y, color, broadcast) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, 3, 0, Math.PI * 2);
            ctx.fill();

            if (broadcast) {
                dataConns.forEach(conn => conn.send({ type: 'draw', x, y, color }));
            }
        }

        function clearBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            dataConns.forEach(conn => conn.send({ type: 'clear_board' }));
        }

        function sendReaction(symbol) {
            showReaction('local', symbol);
            dataConns.forEach(conn => conn.send({ type: 'reaction', peerId: peer.id, symbol }));
        }

        function showReaction(targetId, symbol) {
            const el = document.getElementById(`react-${targetId}`);
            if (el) { el.innerText = symbol; setTimeout(() => el.innerText = '', 3000); }
        }

        // Recording
        function toggleRecording() {
            if (!isRecording) {
                recordedChunks = [];
                mediaRecorder = new MediaRecorder(localStream);
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = `meeting-${Date.now()}.webm`;
                    a.click();
                };
                mediaRecorder.start();
                isRecording = true;
                document.getElementById('recBtn').classList.add('active-mode');
            } else {
                mediaRecorder.stop();
                isRecording = false;
                document.getElementById('recBtn').classList.remove('active-mode');
            }
        }

        function logout() { location.reload(); }
    </script>
</body>
</html>
